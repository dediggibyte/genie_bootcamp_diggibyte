# =================================================================================================
# Genie domain sample "Finance" (simplified) - Declarative Automation Bundle
#
#   * pipeline genie_finance_pipeline - Lakeflow Spark Declarative Pipeline, bronze -> silver -> gold
#   * job      genie_finance_job      - runs the pipeline, then creates the metric views, then validates
#
# Workspace UI (from the Git folder): open this file -> Deployments (rocket icon) -> target "dev" -> Deploy ->
# run "genie_finance_job".
# CLI (from this folder):
#   databricks bundle deploy -t dev            # optionally: --var catalog=<your_catalog>
#   databricks bundle run genie_finance_job -t dev
#
# Run 01_notebooks/01_setup_catalog.py first (schemas, volume, CSV files in your existing catalog). The catalog
# default below is the same as that notebook's default: your short user name.
# =================================================================================================
bundle:
  name: genie_domain_lite_finance

include:
  - resources/*.yml

variables:
  catalog:
    description: >-
      Your existing Unity Catalog catalog (created for you, never by this bundle). Default = your short user
      name, e.g. labuser123_456 for labuser123_456@vocareum.com (same rule as 01_notebooks/01_setup_catalog.py).
      The sample's schemas are finance, finance_landing, finance_bronze, finance_silver and finance_governance.
    default: ${workspace.current_user.short_name}

workspace:
  # one deployment per catalog, so deployments into different catalogs never share state
  root_path: ~/.bundle/${bundle.name}/${bundle.target}/${var.catalog}

targets:
  dev:
    default: true
    mode: development
